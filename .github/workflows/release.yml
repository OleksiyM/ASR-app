name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    strategy:
      matrix:
        arch: [arm64, x86_64]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Требуется для получения истории коммитов и предыдущих тегов

      - name: Install Tools
        run: |
          brew update-reset
          brew install xcodegen create-dmg

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build and Archive App
        run: |
          xcodebuild -project ASRApp.xcodeproj \
                     -scheme ASRApp \
                     -configuration Release \
                     -archivePath ASRApp.xcarchive \
                     archive \
                     ARCHS="${{ matrix.arch }}" \
                     ONLY_ACTIVE_ARCH=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY=""

      - name: Package App into ZIP and DMG
        run: |
          cd ASRApp.xcarchive/Products/Applications
          # Принудительная Ad-Hoc подпись для устранения ошибки Gatekeeper о повреждении (damaged)
          codesign --force --deep --sign - ASRApp.app
          
          # Определяем семантическое имя архитектуры
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            ARCH_NAME="AppleSilicon"
          else
            ARCH_NAME="Intel"
          fi
          
          # 1. Создаем ZIP архив
          zip -r ../../../ASR-App-${ARCH_NAME}.zip ASRApp.app
          cd ../../..
          
          # 2. Создаем временную структуру для сборки DMG
          mkdir -p dmg_temp
          cp -R ASRApp.xcarchive/Products/Applications/ASRApp.app dmg_temp/
          
          # 3. Собираем премиальный DMG с кастомным фоном и разметкой Finder
          create-dmg \
            --volname "ASRApp" \
            --background "Sources/dmg_background.png" \
            --window-size 540 360 \
            --icon-size 96 \
            --icon "ASRApp.app" 130 180 \
            --app-drop-link 410 180 \
            "ASR-App-${ARCH_NAME}.dmg" \
            "dmg_temp/"
          
          rm -rf dmg_temp

      - name: Generate Release Notes and Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Поиск предыдущего тега
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          echo "## What's Changed" > release_notes.md
          
          if [ -z "$PREV_TAG" ]; then
            git log --pretty=format:"* %s by @%an in %h" ${{ github.ref_name }} >> release_notes.md
          else
            git log --pretty=format:"* %s by @%an in %h" $PREV_TAG..${{ github.ref_name }} >> release_notes.md
            echo "" >> release_notes.md
            echo "## Full Changelog: $PREV_TAG...${{ github.ref_name }}" >> release_notes.md
            echo "https://github.com/${{ github.repository }}/compare/$PREV_TAG...${{ github.ref_name }}" >> release_notes.md
          fi
          
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            ARCH_NAME="AppleSilicon"
          else
            ARCH_NAME="Intel"
          fi
          
          # Создаем релиз, если он еще не существует (|| true защищает от рассинхронизации параллельных джобов)
          gh release create ${{ github.ref_name }} --title "Release ${{ github.ref_name }}" --notes-file release_notes.md || true
          
          # Загружаем файлы текущей архитектуры в созданный релиз
          gh release upload ${{ github.ref_name }} ASR-App-${ARCH_NAME}.zip ASR-App-${ARCH_NAME}.dmg --clobber
