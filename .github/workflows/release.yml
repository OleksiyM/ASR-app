name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Требуется для получения истории коммитов и предыдущих тегов

      - name: Install XcodeGen
        run: |
          brew update-reset
          brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build and Archive App
        run: |
          xcodebuild -project ASRApp.xcodeproj \
                     -scheme ASRApp \
                     -configuration Release \
                     -archivePath ASRApp.xcarchive \
                     archive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY=""

      - name: Package App into ZIP
        run: |
          cd ASRApp.xcarchive/Products/Applications
          zip -r ../../../../ASRApp.zip ASRApp.app

      - name: Generate Release Notes and Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Поиск предыдущего тега
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          echo "## What's Changed" > release_notes.md
          
          if [ -z "$PREV_TAG" ]; then
            git log --pretty=format:"* %s by @%an in %h" ${{ github.ref_name }} >> release_notes.md
          else
            git log --pretty=format:"* %s by @%an in %h" $PREV_TAG..${{ github.ref_name }} >> release_notes.md
            echo "" >> release_notes.md
            echo "## Full Changelog: $PREV_TAG...${{ github.ref_name }}" >> release_notes.md
            echo "https://github.com/${{ github.repository }}/compare/$PREV_TAG...${{ github.ref_name }}" >> release_notes.md
          fi
          
          # Создание релиза с помощью встроенной утилиты GitHub CLI (gh) и загрузка архива
          gh release create ${{ github.ref_name }} ASRApp.zip --title "Release ${{ github.ref_name }}" --notes-file release_notes.md
